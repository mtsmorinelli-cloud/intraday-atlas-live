name: Intraday Atlas Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: intraday-atlas-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate source and dashboard
        run: python -m unittest discover -s tests -v
      - name: Calculate market snapshot
        run: python scanner.py
      - name: Publish scanner JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scanner.json
          git diff --cached --quiet || (git commit -m "Update scanner snapshot" && git push)
